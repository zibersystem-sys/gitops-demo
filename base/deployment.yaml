# base/deployment.yaml



apiVersion: apps/v1

kind: Deployment

metadata:

  name: webapp



  annotations:

    argocd.argoproj.io/sync-wave: "2"

spec:

  replicas: 1

  selector:

    matchLabels:

      app: webapp



  template:

    metadata:

      labels:

        app: webapp



    spec:

      containers:

      - name: nginx

        image: nginx:latest



        env:

        - name: ENV

          valueFrom:

            configMapKeyRef:

              name: app-config

              key: ENVIRONMENT



        ports:

        - containerPort: 80
