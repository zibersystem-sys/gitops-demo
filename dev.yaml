apiVersion: v1
data:
  ENVIRONMENT: dev
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: app-config
  namespace: dev
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-service
  namespace: dev
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: webapp
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - env:
        - name: ENV
          valueFrom:
            configMapKeyRef:
              key: ENVIRONMENT
              name: app-config
        image: nginx:1.25
        name: nginx
        ports:
        - containerPort: 80
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: migration-job
  namespace: dev
spec:
  template:
    spec:
      containers:
      - command:
        - sh
        - -c
        - echo Running DB Migration && sleep 15
        image: busybox
        name: migration
      restartPolicy: Never
