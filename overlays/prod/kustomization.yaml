# overlays/prod/kustomization.yaml



namespace: prod



resources:

- ../../base



replicas:

- name: webapp

  count: 3



images:

- name: nginx

  newTag: "1.26"



configMapGenerator:

- name: app-config

  behavior: merge



  literals:

  - ENVIRONMENT=prod



generatorOptions:

  disableNameSuffixHash: true
